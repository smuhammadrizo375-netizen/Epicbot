<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin panel</title><style>
:root{color-scheme:dark;--bg:#0a0e1f;--card:#151a36;--line:#262d5a;--mu:#8b92c4;--or:#ff8a1f}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:#f2f0ff;padding:16px}
.w{max-width:980px;margin:auto}h1{font-size:22px}h3{margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.c small{color:var(--mu)}.c b{display:block;font-size:22px;margin-top:4px}
input,button{font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#0c1030;color:inherit}
button{background:var(--or);color:#2b1300;border:0;font-weight:600;cursor:pointer}button.d{background:#3a2040;color:#ff9aa8}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mu);font-weight:500}
.tb{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}.tb button{background:var(--card);color:#fff;border:1px solid var(--line)}.tb button.on{background:var(--or);color:#2b1300}
.p{display:none;overflow-x:auto}.p.on{display:block}
</style></head><body><div class="w">
<h1>Epic Bot · Admin</h1>
<div class="f" id="lg"><input id="pw" type="password" placeholder="Admin parol"><button onclick="login()">Kirish</button></div>
<div id="app" style="display:none">
<div class="g" id="st"></div>
<div class="tb"><button class="on" data-t="u">Foydalanuvchilar</button><button data-t="p">Promokodlar</button><button data-t="k">Konkurslar</button></div>
<div class="p on c" id="u"><div class="f"><input id="q" placeholder="ID yoki ism"><button onclick="users()">Qidirish</button></div>
<table><thead><tr><th>ID</th><th>Ism</th><th>Balans</th><th>O'yin</th><th>Balans berish</th></tr></thead><tbody id="ub"></tbody></table></div>
<div class="p c" id="p"><h3>Yangi promokod</h3><div class="f"><input id="pcode" placeholder="KOD"><input id="pam" type="number" placeholder="Summa"><input id="pus" type="number" placeholder="Necha kishi"><button onclick="addP()">Yaratish</button></div><table><tbody id="pb"></tbody></table></div>
<div class="p c" id="k"><h3>Yangi konkurs</h3><div class="f"><input id="kt" placeholder="Nomi"><input id="kp" type="number" placeholder="Sovrin"><button onclick="addK()">Yaratish</button></div><table><tbody id="kb"></tbody></table></div>
</div></div><script>
let pw=sessionStorage.pw||'';const $=i=>document.getElementById(i),n=v=>Math.floor(v).toLocaleString('ru');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(p,m='GET',b)=>fetch('/api/admin/'+p,{method:m,headers:{'content-type':'application/json','x-admin':pw},body:b?JSON.stringify(b):undefined}).then(async r=>{const j=await r.json();if(!r.ok)throw j.error;return j}).catch(e=>{alert(e);throw e});
async function login(){pw=$('pw').value||pw;await api('stats');sessionStorage.pw=pw;$('lg').style.display='none';$('app').style.display='block';all()}
document.querySelectorAll('.tb button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tb button').forEach(x=>x.classList.toggle('on',x==b));document.querySelectorAll('.p').forEach(p=>p.classList.toggle('on',p.id==b.dataset.t))});
async function all(){const s=await api('stats');$('st').innerHTML=[['Foydalanuvchilar',s.users],['Jami balans',s.balance],['Stavkalar',s.bets],['Jami stavka',s.wagered],['To\'langan',s.paid],['Promokodlar',s.promos],['Konkurslar',s.contests]].map(x=>`<div class="c"><small>${x[0]}</small><b>${n(x[1])}</b></div>`).join('');users();promos();conts()}
async function users(){const l=await api('users?q='+encodeURIComponent($('q').value));$('ub').innerHTML=l.map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${n(u.balance)}</td><td>${u.games}</td><td><input id="g_${esc(u.id)}" type="number" placeholder="+/-" style="width:100px"> <button onclick="give('${esc(u.id)}')">OK</button></td></tr>`).join('')}
async function give(id){await api('give','POST',{id,amount:$('g_'+id).value});all()}
async function promos(){const l=await api('promos');$('pb').innerHTML=l.map(p=>`<tr><td><b>${esc(p.code)}</b></td><td>${n(p.amount)}</td><td>${p.used} ishlatilgan / ${p.left} qoldi</td><td><button class="d" onclick="delP('${esc(p.code)}')">O'chirish</button></td></tr>`).join('')}
async function addP(){await api('promos','POST',{code:$('pcode').value,amount:$('pam').value,uses:$('pus').value});all()}
async function delP(c){await api('promos/'+c,'DELETE');all()}
async function conts(){const l=await api('contests');$('kb').innerHTML=l.map(c=>`<tr><td><b>${esc(c.title)}</b></td><td>${n(c.prize)}</td><td>${c.players.length} kishi</td><td>${c.done?'G\'olib: '+esc(c.winnerName):`<button onclick="draw('${c.id}')">G'olibni aniqlash</button>`} <button class="d" onclick="delK('${c.id}')">×</button></td></tr>`).join('')}
async function addK(){await api('contests','POST',{title:$('kt').value,prize:$('kp').value});all()}
async function draw(id){await api('contests/'+id+'/draw','POST');all()}
async function delK(id){await api('contests/'+id,'DELETE');all()}
if(pw){$('pw').value=pw;login().catch(()=>{})}
</script></body></html>
