<style>
:root{--bg:#0a0e1f;--card:#151a36;--line:#262d5a;--tx:#f2f0ff;--mu:#8b92c4;--or:#ff8a1f;--mint:#3ddc97;--rose:#ff5d73;--vi:#7c5cff;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:500 16px Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ava{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--vi),#3b82f6);display:grid;place-items:center;font-weight:700;font-size:20px}
.top small{color:var(--mu);display:block;font-size:13px}.top b{font-size:26px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-bottom:10px}
.chip{flex:none;padding:7px 13px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.hi{color:var(--mint)}.lo{color:var(--rose)}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d1228ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;padding:7px 18px;border-radius:16px;color:var(--mu);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:22px}nav button.on{background:#7c5cff33;color:#fff}
section{display:none}section.on{display:block}
/* crash */
.stage{position:relative;height:340px;border-radius:28px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;
 background:url(bg.jpg) center/cover,radial-gradient(ellipse at 20% 100%,#3a1c7a,transparent 60%),radial-gradient(ellipse at 90% 0,#14307a,transparent 55%),#080b1c}
#stars{position:absolute;inset:0;width:100%;height:100%}
.rocket{position:absolute;width:150px;left:8%;bottom:6%;transition:none;will-change:transform,left,bottom;filter:drop-shadow(0 10px 18px #000a)}
.rocket.boom{animation:boom .7s forwards}
@keyframes boom{to{transform:translate(160px,-260px) rotate(50deg) scale(.4);opacity:0}}
.mx{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:62px;font-weight:700;text-shadow:0 4px 24px #0008}
.mx.lose{color:var(--rose)}.mx.win{color:var(--mint)}
.msg{position:absolute;left:0;right:0;top:92px;text-align:center;color:var(--mu);font-size:15px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px}
.row{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;min-width:0;background:#0c1030;border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:13px;font:600 18px Fredoka,sans-serif}
.q{background:#0c1030;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.go{width:100%;padding:17px;border-radius:20px;font-size:20px;font-weight:700;background:linear-gradient(90deg,#ff8a1f,#ff4d6d);box-shadow:0 8px 28px #ff6a3d55}
.go.cash{background:linear-gradient(90deg,#22c58b,#3ddc97);color:#032a1c;box-shadow:0 8px 28px #3ddc9755}.go:disabled{opacity:.5}
h2{font-size:22px;margin:4px 0 12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:8px}
.item small{color:var(--mu);display:block}.btn2{background:var(--vi);padding:9px 16px;border-radius:12px;font-weight:600}.btn2:disabled{background:#333a66}
#err{margin:10px 14px;padding:12px 14px;border-radius:14px;background:#4a1f2c;color:#ffb3c0;font-size:14px}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-90px);background:#fff;color:#14172e;padding:11px 20px;border-radius:14px;font-weight:600;transition:.3s;z-index:9}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.rocket.boom{animation:none;opacity:0}}

html{background:#000}body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url(bg.jpg) center/cover}
.stage{background:radial-gradient(ellipse at 50% 100%,#3a1c7a77,transparent 65%)}
.panel,.item,.chip{background:#12102acc}
.ava{overflow:hidden}.ava img{width:100%;height:100%;object-fit:cover}.cap{font-size:11px;color:var(--mu)}
.tile{position:relative;aspect-ratio:3.5;border-radius:26px;margin-bottom:12px;padding:0;overflow:hidden;display:block;width:100%;text-align:left;color:#fff}
.tile>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:none;filter:none}

.mxt{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px #0006;z-index:2;pointer-events:none}
.t2{background:linear-gradient(120deg,#ffb000,#ffcb3a 60%,#ffe27a)}
.pc{position:absolute;border-radius:18px;box-shadow:0 8px 18px #0003}
.solo{right:96px;top:22px;width:104px;height:88px;background:linear-gradient(160deg,#ffc83d,#ff9d00);border:2px solid #ffe08a;transform:rotate(-4deg);display:grid;place-items:center;font-size:34px}
.vs{right:-14px;top:14px;width:120px;height:100px;background:linear-gradient(110deg,#1e6bff 0 49%,#ff4d2e 51%);transform:rotate(5deg);display:grid;place-items:center;font-size:36px;font-weight:700;font-style:italic}
.blist{display:grid;gap:8px}
.br{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:18px;background:linear-gradient(135deg,#4aa3ff,#2a6df0);border:2px solid #a8d0ff;box-shadow:0 4px 14px #2a6df055}
.br.won{background:linear-gradient(135deg,#2fd27a,#16a34a);border-color:#9af0c0;box-shadow:0 0 18px #22c55e99}
.br.lost{background:linear-gradient(135deg,#ff6b6b,#d62839);border-color:#ffb3b3;box-shadow:0 0 18px #ef444499}
.br.me{outline:2px solid #fff}
.bav{width:38px;height:38px;border-radius:50%;background:#0003;display:grid;place-items:center;overflow:hidden;font-weight:700;flex:none}
.bav img{width:100%;height:100%;object-fit:cover}
.bn{flex:1;min-width:0}.bn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bn small{opacity:.9}
.bp{background:#0004;padding:6px 12px;border-radius:12px;font-weight:700;white-space:nowrap}
.t4{background:linear-gradient(120deg,#ff4d8d,#8b5cf6)}
.reelw{position:relative;overflow:hidden;border-radius:18px;background:#0008;border:1px solid var(--line);padding:10px 0;margin:12px 0}
.reel{display:flex;gap:8px;width:max-content;will-change:transform}
.ri{width:88px;height:78px;flex:none;border:2px solid;border-radius:14px;display:grid;place-items:center;text-align:center;font-weight:700;background:#12102a;font-size:14px;line-height:1.2}
.ri.win{background:#2a2455}
.pin{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 12px #fff;z-index:2;transform:translateX(-50%)}
#cvp{display:flex;flex-wrap:wrap;gap:8px}.pz{padding:8px 12px;border:2px solid;border-radius:12px;background:#12102acc;font-weight:600}

nav{background:#161618f2;border-top:1px solid #2a2a30;padding:8px 6px calc(8px + env(safe-area-inset-bottom));gap:2px}
nav button{flex:1;min-width:0;padding:8px 2px;border-radius:20px;color:#8e8e93;font-size:11px;font-weight:600;gap:4px;line-height:1.1;white-space:nowrap}
nav button svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:#7f6fe0;color:#fff;box-shadow:0 0 22px #7f6fe055}

.cg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cq{aspect-ratio:1;border-radius:24px;background:linear-gradient(160deg,#1c1740dd,#12102add);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;color:#fff;text-align:center}
.cq i{font-style:normal;font-size:56px}.cq b{font-size:15px}.cq span{background:#7c5cff55;padding:4px 12px;border-radius:99px;font-size:14px;font-weight:700}
.pvs{display:flex;gap:10px;margin-bottom:12px}
.side{border-radius:20px;padding:12px;min-width:0;transition:flex .6s;display:flex;flex-direction:column;gap:2px;color:#fff}
.side.b{background:linear-gradient(135deg,#3b82f6,#1d4ed8);box-shadow:0 0 18px #3b82f666}
.side.r{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 0 18px #ef444466}
.side.w{outline:3px solid #fff;box-shadow:0 0 30px #fff9}
.side b{font-size:14px}.side span{font-size:28px;font-weight:700}
.wheelw{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:14px auto 18px}
.wheel{position:absolute;inset:0;border-radius:50%;border:6px solid #1a1a2e;box-shadow:0 0 30px #7c5cff66,inset 0 0 20px #0008;background:conic-gradient(#3b82f6 0 180deg,#ef4444 180deg 360deg)}
.ptr{position:absolute;left:50%;top:-14px;z-index:3;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid #fff;filter:drop-shadow(0 2px 4px #000)}
.hub{position:absolute;left:50%;top:50%;width:40%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#0a0a14;border:4px solid #262d5a;display:grid;place-items:center;text-align:center;font-weight:700;z-index:2;font-size:20px;line-height:1.1}
.go.sb{background:linear-gradient(90deg,#3b82f6,#1d4ed8);box-shadow:0 8px 24px #3b82f655}
.go.sr{background:linear-gradient(90deg,#ef4444,#b91c1c);box-shadow:0 8px 24px #ef444455}
.br.sred{background:linear-gradient(135deg,#ff6b6b,#d62839);border-color:#ffb3b3;box-shadow:0 0 14px #ef444477}
.br.pw{box-shadow:0 0 24px #fff}.br.pd{opacity:.45}
#subw{position:fixed;inset:0;background:#000e;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
#subw .mb2{width:100%;max-width:420px;background:#0e0c20;border:1px solid var(--line);border-radius:26px;padding:20px;text-align:center}

.pcards{display:flex;justify-content:space-between;align-items:center;padding:5% 0 3%}
.pcard{position:relative;width:48.5%;aspect-ratio:540/348;background-size:100% 100%;background-repeat:no-repeat;transition:transform .6s,filter .4s;color:#fff}
#sb{transform-origin:left center}#sr{transform-origin:right center}
.pcard .plate{position:absolute;top:40%;height:34%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px}
#sb .plate{left:50%;width:44%;background:linear-gradient(180deg,#0b2290,#06124a);border:1.5px solid #3b82f6;box-shadow:inset 0 0 14px #3b82f666}
#sr .plate{left:52%;width:43%;background:linear-gradient(180deg,#8a0c20,#4a0612);border:1.5px solid #ef4444;box-shadow:inset 0 0 14px #ef444466}
.pp{font-size:clamp(20px,7vw,34px);font-weight:700;line-height:1;text-shadow:0 0 12px #fff6}
.pt{font-size:12px;opacity:.9;margin-top:2px}
.pcard.w{filter:drop-shadow(0 0 16px #fff)}
.pscene{position:relative;width:100%;aspect-ratio:1122/942;background:url(pvp_scene.jpg) center/100% 100% no-repeat;margin:2px 0 14px}
.pscene .pw{position:absolute;left:22.9%;top:17.3%;width:54.2%;aspect-ratio:1;border-radius:50%;-webkit-mask:radial-gradient(circle closest-side,transparent 45%,#000 46%);mask:radial-gradient(circle closest-side,transparent 45%,#000 46%);background:conic-gradient(#1f6bff 0 180deg,#ff2233 180deg 360deg)}
.pscene .hub{left:37.6%;top:34.8%;width:24.8%;transform:none;background:none;border:0;font-size:clamp(14px,5vw,26px);color:#fff;text-shadow:0 0 10px #000}

.top{position:sticky;top:0;z-index:6;margin:-14px -14px 14px;padding:12px 14px;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid #2a2a30}
.top b{display:flex;align-items:center;gap:8px}.dm{height:26px;width:auto;flex:none}

.udial{position:relative;width:min(340px,92vw);aspect-ratio:1;margin:4px auto 14px}
.udial svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 14px #7c3aed88)}
.uring{fill:none;stroke:#8b5cf6;stroke-width:2.5}.tk{stroke:#a78bfa88;stroke-width:1.6}.tk.big{stroke:#c4b5fd;stroke-width:2.4}
.utrack{fill:none;stroke:#140c2e;stroke-width:36}.uarc{fill:none;stroke:url(#ug);stroke-width:36;filter:drop-shadow(0 0 8px #8b5cf6)}
.ulb{fill:#fff;font:700 13px Fredoka,sans-serif;text-anchor:middle}
#uneedle{transform-origin:150px 150px}
.uctr{position:absolute;inset:26%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:50%;background:radial-gradient(circle,#0b0620,#12082e);border:1px solid #3b1d8a}
.up1{font-size:34px;font-weight:700;color:#c4b5fd;line-height:1.1}.up2{font-size:13px;color:#a78bfa;padding:0 10px;line-height:1.2}
.ucards{display:flex;gap:12px;position:relative;margin-bottom:10px}
.ucard{flex:1;min-width:0;border:1.5px solid #6d3df0;border-radius:22px;background:linear-gradient(160deg,#1a0f3dcc,#0e0824cc);padding:14px 10px;text-align:center;box-shadow:0 0 18px #6d3df044}
.ucard b{display:block;color:#a78bfa;font-size:19px;margin-bottom:8px}

.ucard small{display:block;margin-top:8px;color:#8b92c4;font-size:12px}
.uarrow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#5b21b6);display:grid;place-items:center;font-size:20px;border:4px solid #0a0618;z-index:2}
.uchips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}

.ubtn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:22px;border:2px solid #8b5cf6;background:linear-gradient(90deg,#2a1070,#4c1d95 50%,#2a1070);color:#fff;font-size:18px;font-weight:700;box-shadow:0 0 24px #7c3aed66}

.cg2{align-items:start}
.ck{position:relative;display:block;width:100%;border:0;padding:0;background-color:transparent;background-repeat:no-repeat;border-radius:16px;transition:transform .15s}

</style></head><body>

<script>
const tg=window.Telegram&&Telegram.WebApp,tu=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
if(tg){tg.ready();tg.expand()}
let uid=tu?'tg'+tu.id:localStorage.uid||(localStorage.uid='g'+Math.random().toString(36).slice(2,10));
const $=id=>document.getElementById(id),fmt=n=>Math.floor(n).toLocaleString('ru');
const api=(p,b)=>fetch('/api/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json','x-uid':uid,'x-init':tg?tg.initData:''},body:b?JSON.stringify(b):undefined}).then(async r=>{const j=await r.json();if(!r.ok){if(j.sub)checkSub();throw j.error||'Xato'}return j});
let bal=0,state='idle',t0=0,poll=0,raf=0,lastM=1;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function setBal(v){bal=v;$('bal').textContent=fmt(v)}
function setA(v){$('amt').value=v||bal}
function go(p){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==p));
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==p||((p=='crash'||p=='cases'||p=='pvp'||p=='upgrade')&&b.dataset.p=='home')));
 if(p=='home'||p=='crash')hist();if(p=='crash'){pull();loop()}if(p=='pvp')pullP();if(p=='upgrade')upRender();if(p=='invite')loadInvite();if(p=='cases')loadCases();if(p=='top')loadTop();if(p=='rew')loadRew()}
document.querySelectorAll('nav button[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));
const chipHTML=a=>a.map(x=>`<div class="chip" style="color:${mc(x)}">${x.toFixed(2)}x</div>`).join('');
async function hist(){const h=await api('history');$('hist1').innerHTML=$('hist2').innerHTML=chipHTML(h)}
async function loadTop(){const l=await api('top');$('toplist').innerHTML=l.map((u,i)=>`<div class="item"><span>${['🥇','🥈','🥉'][i]||i+1+'.'} ${esc(u.name)}</span><b>💎 ${fmt(u.balance)}</b></div>`).join('')||'<p style="color:var(--mu)">Hozircha bo\'sh</p>'}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function cons(){const l=await api('contests');$('cons').innerHTML=l.map(c=>`<div class="item"><div><b>${esc(c.title)}</b><small>Sovrin 💎 ${fmt(c.prize)} · ${c.count} ishtirokchi${c.done?' · G\'olib: '+esc(c.winner):''}</small></div>
 <button class="btn2" ${c.done||c.joined?'disabled':''} onclick="join('${c.id}')">${c.done?'Yopilgan':c.joined?'Qatnashyapsiz':'Qatnashish'}</button></div>`).join('')||'<p style="color:var(--mu)">Hozircha konkurs yo\'q</p>'}
function loadRew(){tasks();cons()}
const left=ms=>{const m=Math.ceil(ms/60000);return Math.floor(m/60)+' soat '+m%60+' daq'};
async function tasks(){const l=await api('tasks');$('tasks').innerHTML=l.map(t=>`<div class="item"><div><b>${esc(t.title)}</b><small>${esc(t.desc)} · +${fmt(t.reward)} 💎${t.need?' · '+t.progress+'/'+t.need:''}</small></div>
 <button class="btn2" ${t.status=='ready'?'':'disabled'} onclick="claim('${t.id}')">${{ready:'Olish',wait:left(t.left),todo:'Jarayonda',done:'Bajarildi'}[t.status]}</button></div>`).join('')}
async function claim(id){try{const r=await api('tasks/claim',{id});setBal(r.balance);toast('+'+fmt(r.reward)+' 💎 qo\'shildi');tasks()}catch(e){toast(e)}}
async function join(id){try{await api('contests/join',{id});toast('Qatnashyapsiz!');cons()}catch(e){toast(e)}}
async function promo(){try{const r=await api('promo',{code:$('pc').value});setBal(r.balance);toast('+'+fmt(r.amount)+' 💎 qo\'shildi');$('pc').value=''}catch(e){toast(e)}}

/* ---- Keys rasmlari (keys_sheet.jpg dan kesim) ---- */
const KS={W:1024,H:1536},RK={free:[32,84,348,355],c500:[355,84,672,355],c1000:[678,84,995,355],c2500:[32,341,348,620],c5000:[355,341,672,620],c7500:[678,341,995,620],c8000:[32,606,348,895],c40000:[355,606,672,895],c60000:[678,606,995,895],c100000:[32,884,348,1178],c150000:[355,884,672,1178],c250000:[678,884,995,1178],c500000:[230,1164,793,1460]};
function ktile(id){const r=RK[id];if(!r)return null;const w=r[2]-r[0],hh=r[3]-r[1];
 return `aspect-ratio:${w}/${hh};background-image:url(keys_sheet.jpg);background-size:${KS.W/w*100}% ${KS.H/hh*100}%;background-position:${r[0]/(KS.W-w)*100}% ${r[1]/(KS.H-hh)*100}%`}
/* ---- Umumiy raund ---- */
const mc=m=>m>=100?'#ffd23f':m>=15?'#b36bff':m>=5?'#ff5d73':m>=2?'#4d9dff':'#3ddc97';
function place(m){const p=Math.min(1,Math.log(m)/Math.log(25)),r=$('rk');
 r.style.left=(8+p*52)+'%';r.style.bottom=(6+p*52)+'%';
 r.style.transform=`rotate(${-4-p*6}deg) translateY(${Math.sin(performance.now()/180)*4}px)`}
const rowHTML=b=>`<div class="br ${b.st}${b.me?' me':''}"><div class="bav" ${b.photo?'':`style="background:${b.color||'#0004'}"`}>${b.photo?`<img src="${esc(b.photo)}" referrerpolicy="no-referrer" alt="">`:b.bot?'🤖':esc((b.name||'?')[0].toUpperCase())}</div>
 <div class="bn"><b>${esc(b.name)}</b><small>💎 ${fmt(b.amount)}${b.cash?' ×'+b.cash.toFixed(2):''}</small></div>
 <div class="bp">${b.st=='won'?'💎 '+fmt(b.win):b.st=='lost'?'-'+fmt(b.amount):'💎 '+fmt(b.amount)}</div></div>`;
let R=null,syncAt=0,prev='',lastList='',looping=false;
async function pull(){try{R=await api('round');syncAt=performance.now();setBal(R.balance);state=R.state;
 $('hist1').innerHTML=$('hist2').innerHTML=chipHTML(R.history);
 if(R.state!=prev){if(R.state=='crash')$('rk').classList.add('boom');if(R.state=='wait')$('rk').classList.remove('boom');prev=R.state}
 const l=R.bets.map(rowHTML).join('');if(l!==lastList)$('bl').innerHTML=lastList=l;
 $('bh').textContent='Stavkalar: '+R.count+' · jami 💎 '+fmt(R.total)}catch(e){}}
function draw(){if(!R)return;const d=performance.now()-syncAt,x=$('mx'),b=$('btn'),mine=R.mine;let m=1;
 if(R.state=='wait'){x.textContent=Math.max(0,(R.wait-d)/1000).toFixed(1);x.style.color='#fff';$('msg').textContent='Raund boshlanishiga';place(1)}
 else{m=R.state=='run'?Math.max(1,Math.exp(0.1*(R.elapsed+d)/1000)):R.crash;
  x.textContent=(Math.floor(m*100)/100).toFixed(2)+'x';x.style.color=R.state=='crash'?'#ff5d73':mc(m);
  $('msg').textContent=R.state=='crash'?'💥 Portladi':'';if(R.state=='run')place(m)}
 const can=R.state=='wait'&&!mine,live=R.state=='run'&&mine&&!mine.cash;
 b.className='go'+(live?' cash':'');b.disabled=!(can||live);
 b.textContent=can?'Stavka qilish':live?'Olish 💎 '+fmt(mine.amount*m):R.state=='wait'?'Stavka qabul qilindi ✓':mine&&mine.cash?'Olindi 💎 '+fmt(mine.amount*mine.cash):R.state=='run'?'Raund ketmoqda…':'Keyingi raund…'}
function loop(){if(looping)return;looping=true;(function f(){if(!$('crash').classList.contains('on')){looping=false;return}draw();requestAnimationFrame(f)})()}
setInterval(()=>{if($('crash').classList.contains('on'))pull()},300);
async function act(){const amt=Math.floor(+$('amt').value);$('btn').disabled=true;
 try{if(R.state=='run'){const r=await api('cash',{});setBal(r.balance);R.mine.cash=r.m;toast('+'+fmt(r.win)+' 💎')}
  else{const r=await api('bet',{amount:amt});setBal(r.balance);R.mine={amount:amt,cash:null}}
  pull()}catch(e){toast(e)}}
/* ---- Keyslar ---- */
let CS=[],cur=null,spin=false;const WIN=40,pal=['#64748b','#3b82f6','#22c58b','#b36bff','#ffd23f'];
const ric=(v,it)=>pal[Math.min(4,Math.floor(it.findIndex(x=>x.v==v)/it.length*5))];
async function loadCases(){CS=await api('cases');$('cv').style.display='none';$('cl').style.display='block';
 $('cl').innerHTML='<div class="cg2">'+CS.map(c=>{const st=ktile(c.id),w=!c.price&&c.left>0;
 return st?`<button class="ck${c.id=='c500000'?' ck-last':''}${w?' ckw':''}" style="${st}" onclick="showCase('${c.id}')" aria-label="${esc(c.name)}">${w?`<span class="ckt">⏳ ${left(c.left)}</span>`:''}</button>`
 :`<button class="cq" onclick="showCase('${c.id}')"><i>${c.emoji}</i><b>${esc(c.name)}</b><span>${c.price?'💎 '+fmt(c.price):'BEPUL'}</span></button>`}).join('')+'</div>'}
function showCase(id){cur=CS.find(c=>c.id==id);$('cl').style.display='none';$('cv').style.display='block';$('cvt').textContent=cur.emoji+' '+cur.name;$('cvr').textContent='';fillReel(null);
 $('cvp').innerHTML=cur.items.map(i=>`<div class="pz" style="border-color:${ric(i.v,cur.items)}">💎 ${fmt(i.v)}</div>`).join('');cvBtn()}
function cvBtn(){const b=$('cvb');b.disabled=spin||(!cur.price&&cur.left>0);b.textContent=cur.price?'Ochish 💎 '+fmt(cur.price):cur.left>0?'⏳ '+left(cur.left):'🎁 Bepul ochish'}
function pickW(it){let r=Math.random()*it.reduce((a,i)=>a+i.w,0);for(const i of it){if((r-=i.w)<0)return i.v}return it[0].v}
function fillReel(prize){const it=cur.items,a=[];for(let i=0;i<50;i++)a.push(i==WIN&&prize!=null?prize:pickW(it));
 const r=$('reel');r.style.transition='none';r.style.transform='translateX(0)';
 r.innerHTML=a.map((v,i)=>`<div class="ri${i==WIN&&prize!=null?' win':''}" style="border-color:${ric(v,it)}">💎<br>${fmt(v)}</div>`).join('')}
function closeCase(){if(!spin)loadCases()}
async function openCase(){if(spin)return;spin=true;cvBtn();
 try{const r=await api('cases/open',{id:cur.id});fillReel(r.prize);$('cvr').textContent='';
  const rl=$('reel'),w=rl.parentElement.clientWidth,x=WIN*96+44-w/2+(Math.random()*40-20);
  rl.getBoundingClientRect();rl.style.transition='transform 5.5s cubic-bezier(.12,.65,.12,1)';rl.style.transform=`translateX(${-x}px)`;
  setTimeout(()=>{setBal(r.balance);$('cvr').textContent='Tushdi: 💎 '+fmt(r.prize);toast('💎 '+fmt(r.prize));spin=false;if(!cur.price)cur.left=24*3600e3;cvBtn()},5700)}
 catch(e){toast(e);spin=false;cvBtn()}}
/* ---- PVP ---- */
let PV=null,pSync=0,pSpun=0,pPrev='',pList='';
const prow=b=>{const d=PV.state=='done',w=d&&b.side==PV.winner;
 return `<div class="br ${b.side=='red'?'sred':''}${b.me?' me':''}${d?(w?' pw':' pd'):''}"><div class="bav" ${b.photo?'':`style="background:${b.color||'#0004'}"`}>${b.photo?`<img src="${esc(b.photo)}" referrerpolicy="no-referrer" alt="">`:b.bot?'🤖':esc((b.name||'?')[0].toUpperCase())}</div>
 <div class="bn"><b>${esc(b.name)}</b><small>${b.side=='red'?'🔴 Qizil':'🔵 Ko\'k'}</small></div><div class="bp">💎 ${fmt(w?b.win:b.amount)}</div></div>`};
function spinTo(pt,el){const w=$('wh'),fin=360*6+(360-pt*360),dur=Math.max(0,PV.spinMs-el);
 w.style.transition='none';w.style.transform='rotate(0deg)';w.getBoundingClientRect();
 if(dur<300){w.style.transform=`rotate(${fin}deg)`;return}
 w.style.transition=`transform ${dur}ms cubic-bezier(.1,.6,.12,1)`;w.style.transform=`rotate(${fin}deg)`}
async function pullP(){try{PV=await api('pvp');pSync=performance.now();setBal(PV.balance);
 const t=PV.blue+PV.red,bs=t?PV.blue/t:.5;
 $('sb').style.transform='scale('+(.82+.36*bs)+')';$('sr').style.transform='scale('+(.82+.36*(1-bs))+')';
 $('sbp').textContent=Math.round(bs*100)+'%';$('srp').textContent=(t?100-Math.round(bs*100):50)+'%';
 $('sbt').textContent='💎 '+fmt(PV.blue);$('srt').textContent='💎 '+fmt(PV.red);
 $('wh').style.background=`conic-gradient(#1f6bff 0 ${bs*360}deg,#ff2233 ${bs*360}deg 360deg)`;
 $('sb').classList.toggle('w',PV.winner=='blue');$('sr').classList.toggle('w',PV.winner=='red');
 if(PV.state=='bet'&&pPrev!='bet'){const w=$('wh');w.style.transition='none';w.style.transform='rotate(0deg)'}
 if(PV.state!='bet'&&pSpun!=PV.id){pSpun=PV.id;spinTo(PV.point,PV.state=='spin'?PV.spinMs-PV.spinLeft:PV.spinMs)}
 pPrev=PV.state;
 const m=PV.mine,can=PV.state=='bet';$('pb1').disabled=!can||(m&&m.side!='blue');$('pb2').disabled=!can||(m&&m.side!='red');
 $('ph').innerHTML=PV.hist.map(x=>`<div class="chip">${x=='blue'?'🔵':'🔴'}</div>`).join('');
 const l=PV.bets.map(prow).join('');if(l!==pList)$('pbl').innerHTML=pList=l;
 $('pbh').textContent='Stavkalar: '+PV.count+' · jami 💎 '+fmt(t)}catch(e){}}
function hubP(){if(!PV)return;const d=performance.now()-pSync,h=$('hub');
 h.textContent=PV.state=='bet'?(PV.left==null?'Kutilmoqda':Math.max(0,(PV.left-d)/1000).toFixed(1)):PV.state=='spin'?'🎡':(PV.winner=='blue'?'🔵 Ko\'k yutdi':'🔴 Qizil yutdi')}
async function pbet(side){try{const r=await api('pvp/bet',{side,amount:Math.floor(+$('pamt').value)});setBal(r.balance);pullP()}catch(e){toast(e)}}
setInterval(()=>{if($('pvp').classList.contains('on'))pullP()},400);
setInterval(()=>{if($('pvp').classList.contains('on'))hubP()},100);
async function checkSub(){try{const r=await api('sub');if(r.ok){$('subw').style.display='none';return true}
 $('subl').innerHTML=r.channels.map(c=>`<a class="btn2" style="display:block;margin:8px 0;text-decoration:none;color:#fff" href="${esc(c.url)}" target="_blank">📢 ${esc(c.title)}</a>`).join('');$('subw').style.display='flex';return false}catch(e){return true}}
/* ---- Taklif ---- */
async function loadInvite(){try{const r=await api('ref');$('iv_l').value=r.link||'Havola faqat Telegram ichida chiqadi';
 $('iv_t').innerHTML='Do\'stingiz botga kirib <b>bepul keysni</b> ochsa, sizga <b>💎 '+fmt(r.reward)+' TON</b> beriladi';
 $('iv_s').textContent='Bepul keys ochgan do\'stlar: '+r.count+' · Topilgan: 💎 '+fmt(r.earned)}catch(e){toast(e)}}
function copyRef(){const v=$('iv_l').value;if(navigator.clipboard)navigator.clipboard.writeText(v).then(()=>toast('Nusxalandi ✅')).catch(()=>toast(v));else{$('iv_l').select();document.execCommand('copy');toast('Nusxalandi ✅')}}
function shareRef(){const l=$('iv_l').value;if(l.indexOf('http')!==0)return toast('Havola tayyor emas');
 const u='https://t.me/share/url?url='+encodeURIComponent(l)+'&text='+encodeURIComponent('🚀 Epic fake bot! Kir va bepul keysni och 🎁');
 if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank')}
/* ---- Upgrade ---- */
let upAng=0,upBusy=false,upRes=false;
(function(){let t='';for(let i=0;i<72;i++){const a=i*5*Math.PI/180,r1=i%6?131:127,r2=137,sn=Math.sin(a),cs=-Math.cos(a);
 t+=`<line x1="${150+r1*sn}" y1="${150+r1*cs}" x2="${150+r2*sn}" y2="${150+r2*cs}" class="${i%6?'tk':'tk big'}"/>`}$('uticks').innerHTML=t})();
function arcPath(c){const th=c*360;if(th<1)return'';const r=105,p=a=>[150+r*Math.sin(a),150-r*Math.cos(a)],a1=(180-th/2)*Math.PI/180,a2=(180+th/2)*Math.PI/180,[x1,y1]=p(a1),[x2,y2]=p(a2);
 return `M${x1} ${y1} A${r} ${r} 0 ${th>180?1:0} 1 ${x2} ${y2}`}
function upIn(){upRes=false;upRender()}
function upRender(){const s=+$('us').value,t=+$('ut').value,ok=s>=1000&&t>=Math.ceil(s*1.05)&&t<=s*100&&s<=bal,c=s>0&&t>s?s/t:0;
 $('uarc').setAttribute('d',arcPath(c));
 if(!upBusy&&!upRes)$('uctr').innerHTML=c?`<div class="up1">${(c*100).toFixed(c<.1?1:0)}%</div><div class="up2">x${(t/s).toFixed(2)}</div>`:'<div class="up2">Stavka va maqsadni kiriting</div>';
 $('ubtn').disabled=!ok||upBusy;$('ubt').textContent=upBusy?'…':ok?'Yaxshilash':s>bal?'Balans yetarli emas':'Stavka va maqsadni kiriting'}
function upPreset(k,v){const s=+$('us').value||1000;$('ut').value=k?Math.round(s/(v/100)):s*v;upIn()}
async function upGo(){const st=Math.floor(+$('us').value),tg=Math.floor(+$('ut').value);upBusy=true;upRes=false;upRender();
 try{const r=await api('upgrade',{stake:st,target:tg}),n=$('uneedle');
  n.style.transition='none';n.style.transform=`rotate(${upAng%360}deg)`;n.getBoundingClientRect();
  upAng=360*5+r.angle;n.style.transition='transform 4.5s cubic-bezier(.12,.6,.1,1)';n.style.transform=`rotate(${upAng}deg)`;
  $('uctr').innerHTML='<div class="up2">Aylanmoqda…</div>';
  setTimeout(()=>{setBal(r.balance);upBusy=false;upRes=true;
   $('uctr').innerHTML=r.win?`<div class="up1" style="color:#3ddc97">+${fmt(r.target)}</div><div class="up2">Yutdingiz!</div>`:`<div class="up1" style="color:#ff5d73">✖</div><div class="up2">Omad kelmadi</div>`;
   toast(r.win?'🎉 Yutdingiz!':'Omad kelmadi');upRender()},4700)}
 catch(e){upBusy=false;toast(e);upRender()}}
/* yulduzlar */
(function(){const c=$('stars'),x=c.getContext('2d');let S=[];
 function size(){c.width=c.clientWidth;c.height=c.clientHeight;S=Array.from({length:60},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.6+.3,v:Math.random()*.25+.05}))}
